# Acme Support labs (REST API + MCP) for the Artemis learning guide.
# Same image as fly.toml, mounting only the acme service. Kept separate so
# it can be scaled or torn down without touching the other servers.
#   fly deploy -c fly.acme.toml
app = 'mcp-server-kit-acme'
primary_region = 'ord'

[build]

[env]
  MCP_SERVICES = 'acme'
  MCP_DB_PATH = '/data/api_keys.db'
  ACME_DB_PATH = '/data/acme.db'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[mounts]]
  source = 'acme_data'
  destination = '/data'
