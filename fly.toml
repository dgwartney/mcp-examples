app = 'mcp-example'
primary_region = 'ord'

[build]

[env]
  MCP_DB_PATH = '/data/api_keys.db'
  CONTACTS_DB_PATH = '/data/contacts.db'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[mounts]]
  source = 'mcp_data'
  destination = '/data'
