app = 'mcp-server-kit'
primary_region = 'ord'

[build]

[env]
  MCP_DB_PATH = '/data/api_keys.db'
  CONTACTS_DB_PATH = '/data/contacts.db'
  PTO_DB_PATH = '/data/pto.db'
  ONBOARDING_DB_PATH = '/data/onboarding.db'
  ACME_DB_PATH = '/data/acme.db'
  # Set API credentials via fly secrets — never put keys in fly.toml
  # Weather:  fly secrets set OPENWEATHER_API_KEY=<key>  (https://openweathermap.org/api)
  # Twilio:   fly secrets set TWILIO_ACCOUNT_SID=<sid>
  #           fly secrets set TWILIO_AUTH_TOKEN=<token>
  #           fly secrets set TWILIO_MESSAGING_SERVICE_SID=<mg_sid>
  # SendGrid: fly secrets set SENDGRID_API_KEY=<sg_key>  (https://sendgrid.com)
  #           fly secrets set SENDGRID_FROM_EMAIL=<verified_sender>
  #           fly secrets set SENDGRID_FROM_NAME=<display_name>  # optional

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[mounts]]
  source = 'mcp_data'
  destination = '/data'
