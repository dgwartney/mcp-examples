app = 'mcp-server-kit'
primary_region = 'ord'

[build]

[env]
  MCP_DB_PATH = '/data/api_keys.db'
  CONTACTS_DB_PATH = '/data/contacts.db'
  PTO_DB_PATH = '/data/pto.db'
  ONBOARDING_DB_PATH = '/data/onboarding.db'
  # Acme (the learning guide's labs) runs in its own app: see fly.acme.toml.
  MCP_SERVICES_EXCLUDE = 'acme'
  CVS_HR_DB_PATH = '/data/cvs_hr.db'
  # CVS Phase 2 demo (cvs_demo_systems): its own file, so Savvy's cvs_hr.db is never touched.
  CVS_DEMO_DB_PATH = '/data/cvs_demo.db'
  # CVS HR demo (Savvy): optional, set per demo, never committed —
  #   fly secrets set CVS_HR_DEMO_SMS_TO=<E.164 handset>   (sms_to for case texts)
  #   fly secrets set CVS_HR_AS_OF=2026-10-08               (pin the as-of date; unset afterwards)
  # Set API credentials via fly secrets — never put keys in fly.toml
  # Weather:  fly secrets set OPENWEATHER_API_KEY=<key>  (https://openweathermap.org/api)
  # Twilio:   fly secrets set TWILIO_ACCOUNT_SID=<sid>
  #           fly secrets set TWILIO_AUTH_TOKEN=<token>
  #           fly secrets set TWILIO_MESSAGING_SERVICE_SID=<mg_sid>
  # SendGrid: fly secrets set SENDGRID_API_KEY=<sg_key>  (https://sendgrid.com)
  #           fly secrets set SENDGRID_FROM_EMAIL=<verified_sender>
  #           fly secrets set SENDGRID_FROM_NAME=<display_name>  # optional

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[mounts]]
  source = 'mcp_data'
  destination = '/data'
