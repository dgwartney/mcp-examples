[project]
name = "mcp-server-kit"
description = "Toolkit for building authenticated MCP servers with SQLite-backed API key auth, plus a scaffolding generator and a remote client."
readme = "README.md"
authors = [
    {name = "David Gwartney", email = "david.gwartney@gmail.com"}
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "llm",
    "ai",
    "authentication",
    "api-key",
    "server",
    "toolkit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dynamic = ["version"]
dependencies = [
    "fastmcp>=2.14.5",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/dgwartney/mcp-examples"
Repository = "https://github.com/dgwartney/mcp-examples"
Issues = "https://github.com/dgwartney/mcp-examples/issues"

[project.scripts]
mcp-client = "mcp_server_kit.cli:main"
mcp-server-kit = "mcp_server_kit.scaffold:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mcp_server_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_kit"]
